# NFS server for zombie-container reproduction.
#
# This runs an NFS v3 server in Docker (via crowntail's existing QEMU colima)
# that exports a share with root_squash and restrictive permissions — the same
# conditions that trigger the zombie bug on halfmoon.
#
# Usage:
#   docker compose up -d          # start NFS server
#   ./repro.sh                    # run the reproduction test
#   docker compose down           # cleanup

services:
  # Create the restrictive directory structure first, then start NFS.
  nfs-init:
    image: alpine:latest
    container_name: zombie-nfs-init
    volumes:
      - nfs-data:/export
    entrypoint: >
      sh -c '
        mkdir -p /export/Media/Movies /export/Media/TV /export/Media/Music &&
        chown -R 1000:100 /export/Media &&
        chmod 770 /export/Media/Movies /export/Media/TV /export/Media/Music &&
        chmod 777 /export/Media &&
        echo "init done"
      '

  nfs:
    image: itsthenetwork/nfs-server-alpine
    container_name: zombie-nfs
    privileged: true
    environment:
      SHARED_DIRECTORY: "/export"
    volumes:
      - nfs-data:/export
    ports:
      - "2049:2049"
    depends_on:
      nfs-init:
        condition: service_completed_successfully

  # Traffic shaping proxy — adds latency + packet loss to NFS traffic.
  # Simulates plakatz over a congested/flaky network.
  # The NFS server listens on port 2049 inside the compose network.
  # This proxy sits in front and forwards to the real NFS server with
  # configurable degradation via tc netem.
  #
  # Usage: set NFS_DELAY_MS and NFS_LOSS_PCT env vars, or use defaults.
  # Profiles: use `docker compose --profile slow up -d` to enable.
  nfs-delay:
    image: alpine:latest
    container_name: zombie-nfs-delay
    privileged: true
    cap_add:
      - NET_ADMIN
    profiles:
      - slow
    ports:
      - "2050:2050"
    depends_on:
      - nfs
    volumes:
      - ./delay-proxy.sh:/delay-proxy.sh:ro
    entrypoint: ["/bin/sh", "/delay-proxy.sh"]
    environment:
      NFS_DELAY_MS: ${NFS_DELAY_MS:-200}
      NFS_LOSS_PCT: ${NFS_LOSS_PCT:-5}
      NFS_JITTER_MS: ${NFS_JITTER_MS:-100}

volumes:
  nfs-data:
